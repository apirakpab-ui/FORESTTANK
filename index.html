<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForestTank - แอปพลิเคชันตู้ไม้น้ำและสัตว์น้ำจืด</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2E5A44;
            --accent-green: #4A7C59;
            --light-cream: #F9F6F0;
            --dark-cream: #EFECE6;
            --pure-white: #FFFFFF;
            --alert-red: #D9534F;
            --text-dark: #2C3E50;
            --text-muted: #7F8C8D;
            --shadow-light: 0 4px 15px rgba(0,0,0,0.05);
            --shadow-medium: 0 8px 25px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #1a261f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Mockup Mobile App */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: var(--light-cream);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-medium);
        }

        @media (min-width: 420px) {
            .app-container {
                height: 844px;
                border-radius: 35px;
                border: 8px solid #333;
            }
        }

        /* Screen Wrapper */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            overflow-y: auto;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--light-cream);
            z-index: 1;
        }

        .screen.active {
            display: flex;
            z-index: 2;
        }

        /* ---------------- LOGIN SCREEN ---------------- */
        #login-screen {
            background: linear-gradient(180deg, var(--primary-green) 0%, #1c382a 100%);
            color: var(--pure-white);
            justify-content: center;
            padding: 30px;
            text-align: center;
        }

        .login-logo {
            font-size: 3.5rem;
            color: #A3E4D7;
            margin-bottom: 10px;
        }

        .login-title {
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--pure-white);
        }

        .login-subtitle {
            color: var(--dark-cream);
            font-weight: 300;
            margin-bottom: 35px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--dark-cream);
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: var(--pure-white);
            font-size: 1rem;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background-color: var(--pure-white);
            color: var(--primary-green);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: var(--dark-cream);
        }

        /* ---------------- HOME SCREEN ---------------- */
        .app-header {
            background-color: var(--primary-green);
            color: var(--pure-white);
            padding: 20px 20px 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--pure-white);
            color: var(--primary-green);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .main-content {
            padding: 20px;
            padding-bottom: 90px;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--accent-green);
        }

        .banner {
            width: 100%;
            height: 150px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
            box-shadow: var(--shadow-light);
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-text {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            color: var(--pure-white);
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .category-card {
            background: var(--pure-white);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-light);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .category-card:active {
            transform: scale(0.97);
        }

        .category-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background-color: var(--light-cream);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            color: var(--accent-green);
            margin-bottom: 10px;
        }

        .category-card:nth-child(5) .category-icon {
            color: var(--alert-red);
            background-color: #FDF2F2;
        }

        .category-name {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dark);
            text-align: center;
        }

        /* ---------------- DETAIL LIST SCREENS ---------------- */
        .sub-header {
            background-color: var(--pure-white);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow-light);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .btn-back {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        .sub-header-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 20px;
            padding-bottom: 90px;
        }

        .product-card {
            background: var(--pure-white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow-light);
            display: flex;
            flex-direction: row;
            height: 125px;
        }

        .product-img {
            width: 125px;
            height: 100%;
            object-fit: cover;
            background-color: var(--dark-cream);
            flex-shrink: 0;
        }

        .product-info {
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .product-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 0.95rem;
